name: Capture cosmic screenshots (migration)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  capture:
    if: github.repository == 'Neguchads/navi-abyss' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'navi/own-visuals-02'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: bash scripts/capture-reference.sh
      - name: Commit only the three generated screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/screenshots/navi-overview.png .github/screenshots/navi-architecture.png .github/screenshots/navi-engineering.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: capture real NAVI cosmic ocean"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/navi/own-visuals-02
