name: NAVI reference contract
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: navi-reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm run verify
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run verify
      - run: git diff --exit-code -- ../index.html ../reference.html
      - name: Capture cosmic scene in read-only CI
        run: bash ../scripts/capture-reference.sh "$RUNNER_TEMP/navi-captures"
